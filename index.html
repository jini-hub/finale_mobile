<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0f3d75">
  <title>Finale | 상속 원스톱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" data-action="menu" aria-label="메뉴">☰</button>
    <button class="brand" data-route="dashboard"><span class="brand-mark">F</span><span>Finale</span></button>
    <div class="top-actions">
      <button class="icon-btn" data-action="search">⌕</button>
      <button class="icon-btn" data-action="alerts">🔔</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottom-nav" aria-label="주 메뉴">
    <button data-route="dashboard">⌂<small>홈</small></button>
    <button data-route="case">▣<small>상속절차</small></button>
    <button data-route="assets">₩<small>재산</small></button>
    <button data-route="documents">▤<small>서류</small></button>
    <button data-route="mypage">●<small>내 정보</small></button>
  </nav>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-backdrop" data-action="close-menu"></div>
  <aside class="drawer-panel">
    <div class="drawer-head">
      <div class="brand"><span class="brand-mark">F</span> Finale</div>
      <button class="icon-btn" data-action="close-menu">×</button>
    </div>
    <div class="drawer-user">
      <b>내 상속 사건</b>
      <span id="drawerStatus">진행 전</span>
    </div>
    <button data-route="case">📋 상속 절차 관리</button>
    <button data-route="family">👨‍👩‍👧 상속인·가족관계</button>
    <button data-route="assets">💰 상속재산·채무</button>
    <button data-route="decision">⚖️ 승인·포기 판단</button>
    <button data-route="tax">🧾 상속세 계산</button>
    <button data-route="division">🤝 상속재산분할</button>
    <button data-route="will">✍️ 유언·유류분</button>
    <button data-route="documents">📄 서류센터</button>
    <button data-route="guide">📚 법률 가이드</button>
    <button data-route="expert">👩‍⚖️ 전문가 연결</button>
    <button data-route="settings">⚙️ 설정</button>
  </aside>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
